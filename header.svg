<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0D0B14"/>
      <stop offset="55%" stop-color="#3C096C"/>
      <stop offset="100%" stop-color="#7B2CBF"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E9D8FD"/>
      <stop offset="100%" stop-color="#C77DFF"/>
    </linearGradient>
    <style>
      .fade  { animation: fade 1.6s ease-out both; }
      .fade2 { animation: fade 1.6s ease-out 0.5s both; }
      .fade3 { animation: fade 1.8s ease-out 1.1s both; }
      .mark  { animation: mark 2.4s ease-out 0.3s both; }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes mark { from { opacity: 0; } to { opacity: 0.10; } }
      .jp { font-family: 'Yu Mincho', 'Hiragino Mincho ProN', 'Noto Serif JP', 'MS Mincho', serif; }
    </style>
  </defs>

  <!-- background wave -->
  <path fill="url(#bg)" d="M0,0 H1200 V190 C1000,245 820,170 600,205 C380,240 200,170 0,215 Z"/>
  <path fill="#9D4EDD" opacity="0.18" d="M0,200 C220,160 400,230 620,195 C840,160 1010,230 1200,180 V190 C1000,245 820,170 600,205 C380,240 200,170 0,215 Z"/>

  <!-- vertical kanji watermarks: 諦めない (never give up) -->
  <text class="mark jp" x="1110" y="40" fill="#E9D8FD" font-size="32" writing-mode="tb" letter-spacing="4">諦めない</text>
  <text class="mark jp" x="90" y="40" fill="#E9D8FD" font-size="32" writing-mode="tb" letter-spacing="4">諦めない</text>

  <!-- name -->
  <text class="fade" x="600" y="86" text-anchor="middle" fill="url(#txt)"
        font-family="Cinzel, 'Trajan Pro', Georgia, 'Times New Roman', serif"
        font-size="50" font-weight="700" letter-spacing="4">Hi, I'm Maicol</text>

  <!-- degree -->
  <text class="fade2" x="600" y="124" text-anchor="middle" fill="#C9B6E4"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="19" letter-spacing="3">✦  COMPUTER SCIENCE &amp; INFORMATICS ENGINEERING  ✦</text>

  <!-- motto -->
  <line class="fade3" x1="470" y1="146" x2="730" y2="146" stroke="#C77DFF" stroke-opacity="0.45" stroke-width="1"/>
  <text class="fade3" x="600" y="174" text-anchor="middle" fill="#E0C3FC" font-size="18" letter-spacing="2">
    <tspan class="jp" font-size="20">諦めない</tspan>
    <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic" dx="10">— Never give up</tspan>
  </text>
</svg>
